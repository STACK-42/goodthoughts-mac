name: Release

# Pushing a v* tag builds the app, packs a .dmg, signs it for Sparkle and publishes a
# GitHub Release with the .dmg, its checksum and appcast.xml. Installed copies find the
# update through SUFeedURL (…/releases/latest/download/appcast.xml).
#
# No Apple Developer account is involved: the app is ad-hoc signed and not notarised,
# so first-time users approve it once in Privacy & Security (see the README).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 0.1.0). Makes a draft release."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with the Sparkle package version in project.yml.
  SPARKLE_VERSION: "2.10.0"
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Work out the version
        env:
          RAW: ${{ inputs.version || github.ref_name }}
          KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          version="${RAW#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Tags must look like v1.2.0, got $RAW"; exit 1
          fi
          if [[ -z "$KEY" ]]; then
            echo "::error::The SPARKLE_ED_PRIVATE_KEY secret is missing. See docs/RELEASING.md."; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          xcodebuild archive \
            -project GoodThoughts.xcodeproj \
            -scheme GoodThoughts \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/GoodThoughts.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            | tee archive.log | grep -E '(error|warning):|ARCHIVE (SUCCEEDED|FAILED)' || true
          grep -q 'ARCHIVE SUCCEEDED' archive.log
          app=build/GoodThoughts.xcarchive/Products/Applications/GoodThoughts.app
          codesign --verify --deep --strict --verbose=2 "$app"
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Pack the disk image
        run: |
          name="goodthoughts-$VERSION.dmg"
          scripts/make-dmg.sh "$APP" "build/$name"
          (cd build && shasum -a 256 "$name") | tee "build/$name.sha256"
          echo "DMG=build/$name" >> "$GITHUB_ENV"

      - name: Fetch Sparkle's signing tool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" bin
          echo "SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"

      - name: Sign the update and write the appcast
        env:
          KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/ed.key"
          SPARKLE_KEY_FILE="$RUNNER_TEMP/ed.key" scripts/release/make-appcast.sh "$DMG" "$VERSION" > build/appcast.xml
          rm -f "$RUNNER_TEMP/ed.key"
          xmllint --noout build/appcast.xml
          cat build/appcast.xml

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            draft=(--draft --target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" "$DMG" "$DMG.sha256" build/appcast.xml \
            --title "goodthoughts $VERSION" --generate-notes "${draft[@]}"
